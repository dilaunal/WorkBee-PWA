<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WorkBee Focus</title>

  <!-- PWA ve Mobil Ayarları -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WorkBee">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111111; /* Streamlit koyu temana tam uyum */
    }
    
    /* ALT BARDAKİ REKLAMI EKRANIN DIŞINA İTEN SİHİRLİ MASKELER */
    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      /* Yüksekliği %105 yaparak o alt barda duran beyaz şeridi ekranın altına taşırız */
      height: 105%; 
      border: none;
      display: block;
      /* iOS Safari alt bar gizleme optimizasyonu */
      position: absolute;
      top: 0;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe src="https://workbee-focus.streamlit.app/?embed=true"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
